[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:voice_agent]
command=python agent.py start
directory=/app
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:next_dashboard]
command=node server.js
directory=/app/frontend/.next/standalone
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",HOSTNAME="0.0.0.0",PORT="3000"
autostart=true
autorestart=true
startretries=5
stopwaitsecs=15
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
